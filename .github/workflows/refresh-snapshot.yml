name: Actualizar datos y publicar

# Regenera el snapshot de datos contra las fuentes públicas (sin máquina local)
# usando un MySQL efímero, lo versiona y republica GitHub Pages.
# Se ejecuta cada 6 horas y también a mano desde la pestaña Actions.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-refresh
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: opportunity
          MYSQL_USER: appuser
          MYSQL_PASSWORD: apppass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DATABASE_URL: mysql://appuser:apppass@127.0.0.1:3306/opportunity
      APP_ID: ci-snapshot
      APP_SECRET: ci-snapshot-secret-0123456789abcdef
      NODE_ENV: development
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Regenerar snapshot (pipeline real sobre MySQL efímero)
        working-directory: app
        timeout-minutes: 25
        run: npx tsx scripts/ci-snapshot.mjs

      - name: Versionar snapshot actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/public/snapshot
          if git diff --cached --quiet; then
            echo "Sin cambios en el snapshot."
          else
            git commit -m "Actualizar snapshot de datos ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi

      - name: Compilar sitio estático
        working-directory: app
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          SKIP_SNAPSHOT: "1"
        run: npm run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist/public

  deploy:
    needs: refresh-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
