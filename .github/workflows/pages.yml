name: Publicar en GitHub Pages

# Compila la versión estática (solo frontend + snapshot de datos) y la publica
# en GitHub Pages. No necesita backend ni base de datos: los datos provienen de
# public/snapshot/*.json, versionados en el repositorio.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Instalar dependencias
        working-directory: app
        run: npm ci

      - name: Compilar sitio estático
        working-directory: app
        env:
          # Base del sitio en Pages: /<repositorio>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # No regenerar el snapshot (no hay backend en CI): usa el versionado.
          SKIP_SNAPSHOT: "1"
        run: npm run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
